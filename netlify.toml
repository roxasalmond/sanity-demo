# Netlify reads this automatically: the site lives in web/.
[build]
  base = "web"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  # These values are public by design (they appear in the built pages),
  # so Netlify's secret scanner should not treat them as leaks.
  SECRETS_SCAN_OMIT_KEYS = "SANITY_PROJECT_ID,SANITY_DATASET,SITE_URL"
